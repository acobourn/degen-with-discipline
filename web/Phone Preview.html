<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Degen with Discipline — Phone Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  background:
    radial-gradient(900px 500px at 50% -10%, rgba(34,224,122,0.08), transparent 60%),
    radial-gradient(700px 400px at 100% 10%, rgba(255,77,77,0.05), transparent 55%),
    #060807;
  color:#eef2ef;font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:40px 20px;gap:64px;flex-wrap:wrap;
}
.blurb{max-width:340px}
.blurb .eyebrow{font-family:"JetBrains Mono";font-size:11px;letter-spacing:2px;color:#22e07a;margin-bottom:14px}
.blurb h1{font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1;margin-bottom:8px}
.blurb h1 em{font-weight:500;font-style:italic;color:#8a958f;font-size:.7em}
.blurb p{font-size:15px;line-height:1.6;color:#9aa39d;margin-bottom:22px;text-wrap:pretty}
.blurb a{display:inline-flex;align-items:center;gap:8px;font-family:"JetBrains Mono";font-size:12px;
  letter-spacing:.5px;color:#eef2ef;text-decoration:none;background:#141a18;border:1px solid rgba(255,255,255,0.14);
  padding:12px 18px;border-radius:10px;transition:.18s}
.blurb a:hover{border-color:#22e07a;color:#22e07a}
.stage{flex:0 0 auto}
#root{display:flex;justify-content:center}
@media(max-width:900px){body{flex-direction:column;gap:36px}.blurb{text-align:center;max-width:420px}}
</style>
</head>
<body>
<div class="blurb">
  <div class="eyebrow">DEGEN WITH DISCIPLINE</div>
  <h1>In your pocket, <em>where the damage happens</em></h1>
  <p>Same edge, mobile-first. The Lock of the Day, the best pick per sport, and the receipts behind every call — built to read on the toilet at the sportsbook.</p>
  <a href="Degen with Discipline.html">Open the full site →</a>
</div>
<div class="stage"><div id="root"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel">
function PhonePreview(){
  const [scale,setScale] = React.useState(1);
  React.useEffect(()=>{
    const fit=()=>{
      const avail = Math.min(window.innerHeight-80, 920);
      setScale(Math.min(1, avail/874));
    };
    fit(); window.addEventListener('resize',fit);
    return ()=>window.removeEventListener('resize',fit);
  },[]);
  return (
    <div style={{transform:`scale(${scale})`,transformOrigin:'center top'}}>
      <IOSDevice dark>
        <div style={{height:'100%',paddingTop:50,background:'#080a09'}}>
          <iframe src="Degen with Discipline.html" title="Degen with Discipline"
            style={{width:'100%',height:'100%',border:'none',display:'block',background:'#080a09'}} />
        </div>
      </IOSDevice>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<PhonePreview/>);
</script>
</body>
</html>
