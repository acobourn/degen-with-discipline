<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Degen with Discipline</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --green:#22e07a; --green-2:#36b85f; --red:#ff4d4d; --gold:#ffc24b;
  --glow:rgba(34,224,122,0.22);
  --bg:#080a09; --bg-1:#0e1211; --bg-2:#141a18; --bg-3:#1a2220;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.14);
  --dim-line:rgba(255,255,255,0.28);
  --ink:#eef2ef; --ink-dim:#97a39c; --ink-dimmer:#727d78;
  --maxw:980px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(1100px 600px at 50% -8%, rgba(34,224,122,0.07), transparent 60%),
    radial-gradient(900px 500px at 110% 10%, rgba(255,77,77,0.05), transparent 55%),
    var(--bg);
  min-height:100vh; padding-bottom:120px;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.dim{color:var(--ink-dim)}
.green{color:var(--green)}
.app{max-width:var(--maxw);margin:0 auto;padding:0 18px}

/* ---------------- top bar / brand ---------------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px 4px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{
  display:flex;align-items:center;justify-content:center;width:50px;height:50px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(150deg,var(--bg-3),var(--bg-1));
  border:1px solid var(--line-2);position:relative;overflow:hidden;white-space:nowrap;
  box-shadow:0 0 0 1px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.5);
  font-family:"Archivo";font-weight:900;font-size:18px;letter-spacing:-1px;
}
.brand-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 40%,var(--glow));opacity:.6}
.brand-d,.brand-d2{color:var(--ink)}
.brand-w{color:var(--green);font-size:14px;transform:translateY(2px)}
.brand-name{font-weight:900;font-size:19px;letter-spacing:-0.5px;line-height:1}
.brand-amp{font-weight:500;font-style:italic;color:var(--ink-dim);font-size:.82em;letter-spacing:0}
.brand-tag{font-size:10.5px;letter-spacing:1.6px;color:var(--green);margin-top:6px;font-weight:500}
.topbar-right{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ---------------- record strip (compact line) ---------------- */
.record{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--bg-1),rgba(14,18,17,0.4));
  border:1px solid var(--line);border-radius:11px;padding:10px 16px;margin:4px 4px 16px}
.rec-stat{display:flex;align-items:baseline;gap:7px}
.rec-num{font-size:17px;font-weight:700;letter-spacing:-0.5px}
.rec-lab{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-dim)}
.rec-dot{width:4px;height:4px;border-radius:50%;background:var(--line-2)}
.rec-history{margin-left:auto;font-size:11px;letter-spacing:.5px;color:var(--ink-dim);
  text-decoration:none;border:1px solid var(--line);padding:7px 12px;border-radius:8px;transition:.16s;white-space:nowrap}
.rec-history:hover{color:var(--green);border-color:color-mix(in oklab,var(--green),transparent 60%)}

/* ---------------- sport badge ---------------- */
.sportBadge{display:inline-grid;place-items:center;font-family:"JetBrains Mono";font-weight:700;
  letter-spacing:.5px;border-radius:9px;border:1px solid var(--line-2);flex:0 0 auto}
.sb-sm{font-size:9px;padding:4px 6px}
.sb-md{font-size:11px;width:46px;height:38px}
.sb-lg{font-size:13px;width:60px;height:52px;border-radius:12px}
.sb-MLB{color:#7fb4ff;background:rgba(60,110,200,0.14);border-color:rgba(90,140,230,0.3)}
.sb-NBA{color:#ff9a52;background:rgba(230,120,40,0.14);border-color:rgba(230,140,60,0.3)}
.sb-NHL{color:#9fd6ff;background:rgba(120,190,255,0.12);border-color:rgba(150,200,255,0.28)}
.sb-SOC{color:#7af0a8;background:rgba(40,200,120,0.12);border-color:rgba(70,210,140,0.3)}
.sb-TEN{color:#ffe14d;background:rgba(220,200,40,0.12);border-color:rgba(230,210,70,0.3)}

/* ---------------- grade pill ---------------- */
.grade{display:inline-flex;flex-direction:column;align-items:center;line-height:.95;
  padding:7px 12px;border-radius:11px;border:1px solid var(--line-2);flex:0 0 auto}
.grade-letter{font-family:"Archivo";font-weight:900;letter-spacing:-1px}
.grade-sub{font-family:"JetBrains Mono";font-size:8px;letter-spacing:1.5px;margin-top:2px;color:var(--ink-dim)}
.grade .grade-letter{font-size:20px}
.grade-big .grade-letter{font-size:34px}
.grade-big{padding:10px 16px}
.grade-hot{color:var(--green);background:color-mix(in oklab,var(--green),transparent 90%);border-color:color-mix(in oklab,var(--green),transparent 60%);box-shadow:0 0 24px var(--glow)}
.grade-warm{color:var(--gold);background:color-mix(in oklab,var(--gold),transparent 90%);border-color:color-mix(in oklab,var(--gold),transparent 62%)}

/* ---------------- pick line / odds ---------------- */
.pickline{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pick-text{font-weight:800;letter-spacing:-0.4px;font-size:18px;line-height:1.15;text-wrap:balance}
.pickline-big .pick-text{font-size:clamp(24px,5vw,38px);font-weight:900;letter-spacing:-1px}
.pickline-meta{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.bettype{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-dim);
  border:1px solid var(--line);padding:5px 9px;border-radius:7px}
.odds{font-size:17px;font-weight:700;color:var(--ink);background:var(--bg-3);border:1px solid var(--line-2);
  padding:6px 11px;border-radius:8px}
.pickline-big .odds{font-size:20px}

/* ---------------- LOCK hero ---------------- */
.main{display:block}
.lock{position:relative;border-radius:22px;margin:0 4px 30px;overflow:hidden;
  background:
    radial-gradient(120% 100% at 0% 0%, rgba(34,224,122,0.10), transparent 55%),
    linear-gradient(180deg,var(--bg-2),var(--bg-1));
  border:1px solid color-mix(in oklab,var(--green),transparent 72%);
  box-shadow:0 0 0 1px rgba(0,0,0,0.5), 0 24px 60px -28px var(--glow), 0 30px 80px -40px rgba(0,0,0,0.8);
  opacity:1;animation:lockIn .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes lockIn{from{transform:translateY(14px) scale(.99)}to{transform:none}}
.lock-inner{position:relative;z-index:2;padding:24px}
.lock-tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2.4px;font-weight:700;
  color:var(--green);padding:7px 12px;border-radius:999px;margin-bottom:18px;
  background:color-mix(in oklab,var(--green),transparent 88%);border:1px solid color-mix(in oklab,var(--green),transparent 66%)}
.lock-tag-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.lock-context{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.lock-matchup{font-weight:700;font-size:15px;letter-spacing:-0.2px}
.lock-when{font-size:11px;margin-top:3px;letter-spacing:.5px}
.lock-take{font-size:clamp(15px,2.4vw,18px);line-height:1.45;color:#d6ddd8;margin:16px 0 18px;
  text-wrap:pretty;font-weight:500;max-width:34em}
.lock-stats{display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:18px}
.lock-units,.lock-payout{display:flex;flex-direction:column;gap:2px}
.lock-grade{display:flex;flex-direction:column;align-items:flex-start;gap:9px}
.grade-how{cursor:pointer;background:none;border:none;color:var(--ink-dim);font-family:"JetBrains Mono";
  font-size:10px;letter-spacing:.5px;padding:0;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--line-2);transition:.15s;white-space:nowrap}
.grade-how:hover{color:var(--green);text-decoration-color:var(--green)}
.lock-hit{display:flex;flex-direction:column;gap:2px}
.lock-hit-num{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.lock-hit .mono.dim{font-size:9.5px;letter-spacing:1px;text-transform:uppercase}
.gradex{background:var(--bg-1);border:1px solid color-mix(in oklab,var(--green),transparent 78%);
  border-radius:12px;padding:15px 16px;margin-bottom:18px;animation:expand .3s ease both}
.gradex-head{font-size:9.5px;letter-spacing:1.6px;color:var(--green);margin-bottom:14px}
.gradex-rows{display:flex;flex-direction:column;gap:11px}
.gradex-row{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
.gradex-k{font-size:9.5px;letter-spacing:.6px;color:var(--ink-dimmer);text-transform:uppercase;padding-top:2px}
.gradex-v{font-size:12.5px;color:#cfd6d1;font-weight:500;line-height:1.45}
.gradex-foot{font-size:10px;color:var(--ink-dimmer);line-height:1.55;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.lock-units-num,.lock-payout-num{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.lock-payout-num{color:var(--green)}
.lock-stats .mono.dim{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase}

/* lock treatments */
.lock-vault{border-color:color-mix(in oklab,var(--gold),transparent 70%)}
.vault-ring{position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;
  border:2px dashed color-mix(in oklab,var(--gold),transparent 72%);z-index:1;opacity:.5;
  animation:spin 40s linear infinite}
.vault-ring::after{content:"";position:absolute;inset:26px;border-radius:50%;border:2px solid color-mix(in oklab,var(--gold),transparent 80%)}
@keyframes spin{to{transform:rotate(360deg)}}
.lock-vault .lock-tag{color:var(--gold);background:color-mix(in oklab,var(--gold),transparent 88%);border-color:color-mix(in oklab,var(--gold),transparent 66%)}
.lock-vault .lock-tag-dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.spot-beam{position:absolute;top:-40%;left:50%;width:130%;height:160%;transform:translateX(-50%);z-index:1;
  background:radial-gradient(50% 40% at 50% 0%, var(--glow), transparent 70%);pointer-events:none}
.lock-spotlight{border-color:color-mix(in oklab,var(--green),transparent 60%)}

/* ---------------- confidence meter ---------------- */
.conf{margin:4px 0 14px}
.conf-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.conf-head .mono.dim{font-size:9.5px;letter-spacing:1.4px}
.conf-num{font-size:14px;font-weight:700;color:var(--green)}
.conf-track{height:8px;border-radius:99px;background:var(--bg-3);overflow:hidden;border:1px solid var(--line)}
.conf-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-2),var(--green));
  transition:width 1s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 14px var(--glow)}

/* ---------------- data points flex ---------------- */
.dp{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.dp-num{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-0.5px;
  font-variant-numeric:tabular-nums}
.dp-label{font-size:11px;color:var(--ink-dim);letter-spacing:.3px}
.dp-mini .dp-num{font-size:16px}
.dp-mini .dp-label{font-size:10px}

/* ---------------- reveal button ---------------- */
.reveal{margin-top:18px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:"JetBrains Mono";font-size:12px;letter-spacing:.5px;font-weight:500;
  color:var(--ink);background:var(--bg-3);border:1px solid var(--line-2);
  padding:11px 16px;border-radius:10px;transition:.18s}
.reveal:hover{border-color:var(--green);color:var(--green);box-shadow:0 0 18px -4px var(--glow)}
.reveal-arrow{transition:transform .25s;font-size:13px}
.reveal-arrow.open{transform:rotate(180deg)}
.reveal-mini{margin-top:0;padding:8px 12px;font-size:11px}

/* ---------------- why block ---------------- */
.lock-why,.pcard-why{animation:expand .3s ease both;margin-top:16px}
@keyframes expand{from{transform:translateY(-6px)}to{transform:none}}
.why-take{font-size:14px;line-height:1.55;color:#c7cfca;margin-bottom:16px;text-wrap:pretty}
.why-min{display:flex;align-items:center;gap:10px;font-size:13px}
.why-min .mono.dim{font-size:10px;letter-spacing:1px}
.why-min-driver{font-weight:700;color:var(--green)}

/* factors */
.factors{display:flex;flex-direction:column;gap:13px}
.factors-dense{gap:9px;margin-top:10px}
.factor-top{display:grid;grid-template-columns:1fr auto;align-items:start;gap:2px 12px;margin-bottom:8px}
.factor-label{font-size:12.5px;font-weight:600;color:#d2d9d4;line-height:1.3}
.factor-val{font-size:12px;font-weight:700;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.factor-track{height:6px;border-radius:99px;background:var(--bg-3);overflow:hidden;border:1px solid var(--line)}
.factor-fill{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.factor-note{font-size:10px;color:var(--ink-dimmer);margin-top:5px;letter-spacing:.2px}
.factors-dense .factor-note{display:none}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;
  padding:7px 11px;border-radius:9px;background:var(--bg-3);border:1px solid var(--line)}
.chip-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

/* terminal */
.terminal{font-family:"JetBrains Mono";font-size:12px;line-height:1.7;
  background:#06120c;border:1px solid color-mix(in oklab,var(--green),transparent 78%);
  border-radius:12px;padding:14px 16px}
.term-line{display:flex;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.term-key{color:var(--green-2);min-width:54px;flex:0 0 auto}
.term-key::before{content:"› "}
.term-read{color:#aeb8b2;flex:1}
.term-out{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.term-fire{color:var(--green);font-weight:700;letter-spacing:1px}

/* ---------------- section head ---------------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin:8px 4px 16px;flex-wrap:wrap}
.section-title{font-size:clamp(20px,3.5vw,28px);font-weight:900;letter-spacing:-1px}
.section-note{font-size:11px;letter-spacing:.8px}

/* ---------------- pick cards grid ---------------- */
.picks{display:grid;grid-template-columns:1fr;gap:14px;margin:0 4px}
.pcard{background:linear-gradient(180deg,var(--bg-1),rgba(10,12,11,0.5));
  border:1px solid var(--line);border-radius:16px;padding:16px 17px;transition:border-color .2s, box-shadow .2s}
.pcard:hover{border-color:var(--line-2)}
.pcard.open{border-color:color-mix(in oklab,var(--green),transparent 70%);box-shadow:0 16px 40px -28px var(--glow)}
.pcard-head{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;
  background:none;border:none;color:inherit;cursor:pointer;text-align:left;padding:0}
.pcard-left{display:flex;align-items:center;gap:12px;min-width:0}
.pcard-matchup{font-weight:700;font-size:14px;letter-spacing:-0.2px;line-height:1.2}
.pcard-league{font-size:10px;margin-top:3px;letter-spacing:.5px}
.pcard-pick{display:flex;flex-direction:column;align-items:flex-start;gap:12px;
  margin:15px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.pcard-pickmain{display:flex;flex-direction:column;align-items:flex-start;gap:7px;width:100%;min-width:0}
.pcard-pickmeta{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.lockmini{font-size:9.5px;letter-spacing:1px;color:var(--green);background:color-mix(in oklab,var(--green),transparent 88%);
  border:1px solid color-mix(in oklab,var(--green),transparent 66%);padding:3px 7px;border-radius:6px;font-weight:700;flex:0 0 auto}
.pcard-pickmeta{display:flex;align-items:center;gap:9px}
.pcard-take{font-size:13px;line-height:1.5;color:#aab2ad;margin-top:11px;text-wrap:pretty}
.pcard-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
.pcard-why{padding-top:14px;border-top:1px solid var(--line)}
.pcard-why .conf{margin-top:0}

/* ---------------- footer ---------------- */
.foot{margin:40px 4px 0;padding:24px 0 0;border-top:1px solid var(--line);text-align:center}
.foot-line{font-weight:900;font-size:13px;letter-spacing:2px;color:var(--ink-dim);font-family:"Archivo"}
.foot-disc{font-size:10.5px;line-height:1.7;color:var(--ink-dimmer);max-width:60ch;margin:12px auto 0;letter-spacing:.2px}

/* ---------------- statusline: countdown + desk ---------------- */
.statusline{display:flex;flex-direction:column;align-items:flex-start;gap:10px;
  margin:0 4px 24px;padding:0 2px}
.countdown{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:1px}
.cd-dot{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.6s infinite}
.cd-label{color:var(--ink-dim)}
.cd-time{color:var(--ink);font-weight:700;font-size:13px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.desk{display:inline-flex;align-items:center;gap:10px;min-width:0;max-width:100%}
.desk-label{font-size:9px;letter-spacing:1.6px;color:var(--green);border:1px solid color-mix(in oklab,var(--green),transparent 70%);
  padding:3px 7px;border-radius:5px;flex:0 0 auto}
.desk-quip{font-size:12.5px;color:var(--ink-dim);font-style:italic;opacity:0;transform:translateY(4px);
  transition:opacity .35s,transform .35s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.desk-quip.in{opacity:1;transform:none}

/* ---------------- line movement ---------------- */
.linemove{display:inline-flex;align-items:center;gap:8px;margin:14px 0 0;font-size:12px;
  padding:6px 10px;border-radius:8px;background:var(--bg-1);border:1px solid var(--line);width:fit-content}
.lm-open{color:var(--ink-dimmer);text-decoration:line-through;font-size:11px}
.lm-arrow{font-weight:700}
.lm-now{font-weight:700;color:var(--ink)}
.lm-tag{font-size:9px;letter-spacing:1.2px;padding:2px 6px;border-radius:5px}
.lm-pts{font-size:10px;font-weight:700}
.lm-steam .lm-arrow,.lm-steam .lm-pts{color:var(--green)}
.lm-steam .lm-tag{color:var(--green);background:color-mix(in oklab,var(--green),transparent 88%)}
.lm-value .lm-arrow,.lm-value .lm-pts{color:var(--gold)}
.lm-value .lm-tag{color:var(--gold);background:color-mix(in oklab,var(--gold),transparent 88%)}
.pcard .linemove{margin:12px 0 0;padding:5px 9px;font-size:11px}

/* ---------------- value meter ---------------- */
.vmeter{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:16px}
.vmeter-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px}
.vmeter-head .mono.dim{font-size:9.5px;letter-spacing:1.4px}
.vmeter-edge{font-size:13px;font-weight:700;color:var(--green)}
.vmeter-track{position:relative;display:flex;height:10px;border-radius:99px;background:var(--bg-3);
  border:1px solid var(--line);margin-bottom:24px;overflow:visible}
.vmeter-market{height:100%;border-radius:99px 0 0 99px;background:color-mix(in oklab,var(--ink),transparent 72%);
  position:relative;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.vmeter-edgefill{height:100%;background:linear-gradient(90deg,var(--green-2),var(--green));
  box-shadow:0 0 12px var(--glow);transition:width 1s cubic-bezier(.2,.7,.2,1)}
.vmeter-cap{position:absolute;bottom:-18px;font-size:8.5px;letter-spacing:.8px;white-space:nowrap}
.vmeter-market .vmeter-cap{left:0;color:var(--ink-dim)}
.vmeter-tick{position:absolute;top:-4px;width:2px;height:18px;background:var(--green);border-radius:2px;
  transition:left 1s cubic-bezier(.2,.7,.2,1)}
.vmeter-tick .vmeter-cap{bottom:auto;top:20px;transform:translateX(-50%)}
.vmeter-note{font-size:10.5px;color:var(--ink-dim);line-height:1.5;margin-top:2px}

/* ---------------- rank badge + beat-the-field ---------------- */
.lock-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.lock-tag{margin-bottom:0}
.rank{font-size:18px;font-weight:700;color:var(--green);letter-spacing:-0.5px;display:flex;align-items:baseline;gap:5px}
.rank-sub{font-size:9px;letter-spacing:1.2px;color:var(--ink-dim);font-weight:500}
.field{margin:18px 0;padding:14px 15px;border-radius:12px;background:var(--bg-1);border:1px solid var(--line)}
.field-label{font-size:9.5px;letter-spacing:1.6px;color:var(--ink-dim);display:block;margin-bottom:12px}
.field-rows{display:flex;flex-direction:column;gap:9px}
.field-row{display:flex;align-items:center;gap:10px}
.field-rank{font-size:11px;color:var(--ink-dimmer);font-weight:700;width:20px;flex:0 0 auto}
.field-pick{font-size:12.5px;font-weight:600;color:#cfd6d1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field-row .grade{padding:4px 8px}
.field-row .grade-letter{font-size:13px}
.field-row .grade-sub{display:none}
.field-foot{font-size:10px;color:var(--ink-dimmer);margin-top:12px;display:block;line-height:1.5}

/* ---------------- tail button ---------------- */
.tail{cursor:pointer;font-family:"JetBrains Mono";font-size:12.5px;font-weight:700;letter-spacing:.3px;
  color:#06140c;background:var(--green);border:1px solid var(--green);padding:12px 20px;border-radius:10px;
  transition:.16s;white-space:nowrap}
.tail:hover{filter:brightness(1.08);box-shadow:0 0 22px -4px var(--glow)}
.tail.tailed{background:transparent;color:var(--green);border-color:color-mix(in oklab,var(--green),transparent 50%)}
.tail-sm{padding:8px 13px;font-size:11px}
.lock-actions{display:flex;gap:10px;margin-top:20px}
.lock-actions .tail{flex:1}
.lock-actions .reveal{margin-top:0}
.pcard-actions{display:flex;align-items:center;gap:8px}

/* ---------------- degen special ---------------- */
.special{position:relative;border-radius:20px;margin:30px 4px 0;overflow:hidden;
  background:linear-gradient(180deg,#1a1410,var(--bg-1));
  border:1px solid color-mix(in oklab,var(--gold),transparent 64%);
  box-shadow:0 24px 60px -34px color-mix(in oklab,var(--gold),transparent 40%)}
.special-glow{position:absolute;top:-50%;right:-10%;width:60%;height:200%;
  background:radial-gradient(closest-side, color-mix(in oklab,var(--gold),transparent 80%), transparent);pointer-events:none}
.special-inner{position:relative;z-index:2;padding:22px}
.special-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.special-kicker{font-size:10px;letter-spacing:2px;color:var(--gold);margin-bottom:8px}
.special-name{font-size:24px;font-weight:900;letter-spacing:-0.8px;line-height:1}
.special-sub{font-size:11px;margin-top:5px}
.special-odds{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto}
.special-odds-num{font-size:26px;font-weight:700;color:var(--gold);letter-spacing:-0.5px}
.special-odds .mono.dim{font-size:9px;letter-spacing:1.2px;text-transform:uppercase}
.special-legs{display:flex;flex-direction:column;gap:1px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px}
.special-leg{display:flex;align-items:center;gap:11px;padding:11px 13px;background:var(--bg-2)}
.special-leg-n{width:18px;height:18px;border-radius:5px;background:color-mix(in oklab,var(--gold),transparent 82%);
  color:var(--gold);font-size:10px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.special-leg-label{flex:1;font-size:13px;font-weight:600;min-width:0}
.special-leg-odds{font-size:13px;padding:4px 8px}
.special-take{font-size:13px;line-height:1.55;color:#bcc4be;margin-bottom:18px;text-wrap:pretty}
.special-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.special-payout{display:flex;flex-direction:column;gap:1px}
.special-payout-num{font-size:20px;font-weight:700;color:var(--gold);letter-spacing:-0.5px}
.special-payout .mono.dim{font-size:9px;letter-spacing:1px;text-transform:uppercase}
.tail-special{background:var(--gold);border-color:var(--gold);color:#1a1207}
.tail-special.tailed{background:transparent;color:var(--gold);border-color:color-mix(in oklab,var(--gold),transparent 50%)}

/* ---------------- sort bar ---------------- */
.sortbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 4px 14px;flex-wrap:wrap}
.sortbar-count{font-size:10px;letter-spacing:1.4px;color:var(--ink-dim)}
.sortbar-right{display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--bg-1);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg-btn{cursor:pointer;background:none;border:none;color:var(--ink-dim);font-family:"JetBrains Mono";font-size:11px;
  font-weight:500;padding:6px 12px;border-radius:6px;transition:.15s}
.seg-btn.on{background:var(--bg-3);color:var(--ink)}
.agrade{cursor:pointer;display:inline-flex;align-items:center;gap:7px;background:var(--bg-1);border:1px solid var(--line);
  color:var(--ink-dim);font-family:"JetBrains Mono";font-size:11px;padding:7px 12px;border-radius:9px;transition:.15s}
.agrade.on{color:var(--green);border-color:color-mix(in oklab,var(--green),transparent 60%)}
.agrade-box{width:14px;height:14px;border-radius:4px;border:1px solid var(--line-2);display:grid;place-items:center;
  font-size:10px;color:var(--green)}
.agrade.on .agrade-box{border-color:var(--green);background:color-mix(in oklab,var(--green),transparent 85%)}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-dim);font-size:12px;padding:30px 20px;
  border:1px dashed var(--line-2);border-radius:14px;line-height:1.6}

/* ---------------- sticky bet slip ---------------- */
.slipwrap{position:fixed;left:0;right:0;bottom:0;z-index:1000;display:flex;justify-content:center;
  padding:14px;pointer-events:none}
.slip{pointer-events:auto;width:min(560px,100%);background:rgba(16,21,19,0.92);backdrop-filter:blur(16px);
  border:1px solid color-mix(in oklab,var(--green),transparent 62%);border-radius:16px;overflow:hidden;
  box-shadow:0 -4px 24px rgba(0,0,0,0.5),0 20px 50px -20px var(--glow);
  animation:slipUp .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes slipUp{from{transform:translateY(20px)}to{transform:none}}
.slip-bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:none;border:none;color:inherit;cursor:pointer;padding:14px 16px;text-align:left}
.slip-bar-left{display:flex;align-items:center;gap:10px;min-width:0}
.slip-count{width:26px;height:26px;border-radius:8px;background:var(--green);color:#06140c;font-weight:700;
  font-size:13px;display:grid;place-items:center;flex:0 0 auto}
.slip-bar-label{font-weight:700;font-size:13px}
.slip-bar-odds{font-size:13px;color:var(--green);font-weight:700}
.slip-bar-right{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.slip-bar-payout{font-size:12px;color:var(--ink-dim)}
.slip-bar-payout b{color:var(--ink);font-weight:700}
.slip-chev{font-size:14px;color:var(--ink-dim);transition:transform .25s}
.slip-chev.up{transform:rotate(180deg)}
.slip-body{padding:0 16px 16px;border-top:1px solid var(--line);animation:expand .3s ease both}
.slip-legs{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.slip-leg{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--bg-1);border-radius:9px;border:1px solid var(--line)}
.slip-leg-label{flex:1;font-size:12.5px;font-weight:600;min-width:0}
.slip-leg-odds{font-size:12px;padding:3px 7px}
.slip-x{cursor:pointer;background:none;border:none;color:var(--ink-dimmer);font-size:18px;line-height:1;padding:0 2px;transition:.15s}
.slip-x:hover{color:var(--red)}
.slip-stake{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0}
.slip-stake .mono.dim{font-size:10px;letter-spacing:1.4px}
.stake-chips{display:flex;gap:6px}
.stake-chip{cursor:pointer;background:var(--bg-1);border:1px solid var(--line);color:var(--ink-dim);
  font-size:12px;font-weight:500;padding:7px 12px;border-radius:8px;transition:.15s}
.stake-chip.on{background:color-mix(in oklab,var(--green),transparent 86%);border-color:var(--green);color:var(--green)}
.slip-totals{display:flex;flex-direction:column;gap:7px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.slip-total-row{display:flex;justify-content:space-between;font-size:12.5px}
.slip-total-row .mono.dim{font-size:12px}
.slip-total-row.big{font-size:16px;font-weight:700;padding-top:5px}
.slip-place{width:100%;cursor:pointer;background:var(--green);color:#06140c;border:none;font-family:"JetBrains Mono";
  font-size:13px;font-weight:700;padding:14px;border-radius:11px;transition:.16s}
.slip-place:hover{filter:brightness(1.08)}
.slip-place.done{background:color-mix(in oklab,var(--green),transparent 82%);color:var(--green);cursor:default}
.slip-clear{width:100%;cursor:pointer;background:none;border:none;color:var(--ink-dimmer);font-family:"JetBrains Mono";
  font-size:11px;padding:10px;transition:.15s}
.slip-clear:hover{color:var(--red)}
.slip-disc{font-size:9px;color:var(--ink-dimmer);text-align:center;line-height:1.5;margin-top:2px}

/* ---------------- responsive ---------------- */
@media(min-width:680px){
  .app{padding:0 26px}
  .lock-inner{padding:34px}
  .special-inner{padding:30px}
  .statusline{flex-direction:row;align-items:center;justify-content:space-between}
  .picks{grid-template-columns:1fr 1fr}
  .pcard{padding:18px 20px}
}
@media(min-width:980px){
  .lock-inner{padding:40px 44px}
}
@media(max-width:430px){
  .topbar{padding-top:16px}
  .rec-div-wide{display:none}
  .rec-yest{width:100%;border-top:1px solid var(--line);padding-top:12px}
  .lock-stats{gap:16px}
}
</style>
</head>
